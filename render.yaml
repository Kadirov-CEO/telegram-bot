services:
  - type: web
    name: mudarris-akademiyasi-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false
      - key: SITE_URL
        value: https://mudarris-akadmeiyasi.netlify.app/
      - key: WEBHOOK_SECRET
        sync: false
